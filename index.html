function addXP(n){var before=level(S.xp).L;S.xp+=n;var after=level(S.xp).L;if(after>before)toast(String(after),'Новий рівень: '+after,rank(after));}
function record(q,ok){
  var s=st(q.id);s=Object.assign({},s);
  if(ok){s.c++;s.s++;}else{s.w++;s.s=0;}
  S.stats[q.id]=s;S.answered++;if(ok)S.correct++;
  var i=S.mistakes.indexOf(q.id);
  if(!ok&&i<0)S.mistakes.push(q.id);
  if(ok&&i>=0&&s.s>=2)S.mistakes.splice(i,1);
  var d=today();if(S.days.indexOf(d)<0){S.days.push(d);if(S.days.length>400)S.days=S.days.slice(-400);}
  save();
}

/* ---------- road signs (SVG) ---------- */
function oct(r){var p=[];for(var i=0;i<8;i++){var a=Math.PI/8+i*Math.PI/4;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
var RED='#D3262F',BLUE='#1D5BC4',YEL='#F2C200',INK='#16181B';
function ring(fill){return '<circle cx="50" cy="50" r="44" fill="'+fill+'" stroke="'+RED+'" stroke-width="9"/>';}
function blueDisc(){return '<circle cx="50" cy="50" r="46" fill="'+BLUE+'" stroke="#fff" stroke-width="2.5"/>';}
function triUp(){return '<polygon points="50,9 94,87 6,87" fill="#fff" stroke="'+RED+'" stroke-width="8" stroke-linejoin="round"/>';}
function car(x,col){return '<g fill="'+col+'"><rect x="'+(x+3)+'" y="33" width="16" height="12" rx="3"/><rect x="'+x+'" y="42" width="22" height="16" rx="4"/><rect x="'+(x+1)+'" y="57" width="5" height="6" rx="1"/><rect x="'+(x+16)+'" y="57" width="5" height="6" rx="1"/></g>';}
var SIGNS={
 giveway:'<polygon points="7,13 93,13 50,90" fill="#fff" stroke="'+RED+'" stroke-width="9" stroke-linejoin="round"/>',
 stop:'<polygon points="'+oct(48)+'" fill="#fff"/><polygon points="'+oct(44)+'" fill="'+RED+'"/><text x="50" y="58.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23" fill="#fff">STOP</text>',
 main:'<polygon points="50,3 97,50 50,97 3,50" fill="#fff" stroke="'+INK+'" stroke-width="2"/><polygon points="50,19 81,50 50,81 19,50" fill="'+YEL+'"/>',
 mainend:'<polygon points="50,3 97,50 50,97 3,50" fill="#fff" stroke="'+INK+'" stroke-width="2"/><polygon points="50,19 81,50 50,81 19,50" fill="'+YEL+'"/><g stroke="'+INK+'" stroke-width="3"><line x1="27" y1="40" x2="60" y2="73"/><line x1="34" y1="34" x2="66" y2="66"/><line x1="40" y1="27" x2="73" y2="60"/></g>',
 notraffic:ring('#fff'),
 noentry:'<circle cx="50" cy="50" r="47" fill="'+RED+'"/><rect x="17" y="41" width="66" height="18" fill="#fff"/>',
 speed60:ring('#fff')+'<text x="50" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="36" fill="'+INK+'">60</text>',
 nostop:ring(BLUE)+'<g stroke="'+RED+'" stroke-width="8"><line x1="22" y1="22" x2="78" y2="78"/><line x1="78" y1="22" x2="22" y2="78"/></g>',
 nopark:ring(BLUE)+'<line x1="22" y1="22" x2="78" y2="78" stroke="'+RED+'" stroke-width="8"/>',
 straight:blueDisc()+'<path d="M50 18 L71 43 H57 V82 H43 V43 H29 Z" fill="#fff"/>',
 right:blueDisc()+'<path d="M82 50 L57 29 V43 H18 V57 H57 V71 Z" fill="#fff"/>',
 left:blueDisc()+'<path d="M18 50 L43 29 V43 H82 V57 H43 V71 Z" fill="#fff"/>',
 parking:'<rect x="5" y="5" width="90" height="90" rx="10" fill="'+BLUE+'" stroke="#fff" stroke-width="3"/><text x="50" y="74" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="66" fill="#fff">P</text>',
 danger:triUp()+'<rect x="45.5" y="38" width="9" height="28" rx="3" fill="'+INK+'"/><circle cx="50" cy="75" r="5" fill="'+INK+'"/>',
 lights:triUp()+'<rect x="41" y="35" width="18" height="44" rx="5" fill="'+INK+'"/><circle cx="50" cy="44" r="5" fill="'+RED+'"/><circle cx="50" cy="57" r="5" fill="'+YEL+'"/><circle cx="50" cy="70" r="5" fill="#1E9E57"/>',
 crossing:'<rect x="5" y="5" width="90" height="90" rx="8" fill="'+BLUE+'" stroke="#fff" stroke-width="3"/><polygon points="50,13 88,84 12,84" fill="#fff"/><g fill="'+INK+'"><rect x="24" y="76" width="8" height="4"/><rect x="36" y="76" width="8" height="4"/><rect x="48" y="76" width="8" height="4"/><rect x="60" y="76" width="8" height="4"/></g><circle cx="52" cy="37" r="5" fill="'+INK+'"/><g stroke="'+INK+'" stroke-width="4.5" stroke-linecap="round" fill="none"><path d="M51 44 L48 59"/><path d="M48 59 L41 71"/><path d="M48 59 L57 70"/><path d="M50 48 L42 55"/><path d="M50 48 L59 53"/></g>',
 oneway:'<rect x="22" y="4" width="56" height="92" rx="6" fill="'+BLUE+'" stroke="#fff" stroke-width="3"/><path d="M50 15 L68 39 H57 V86 H43 V39 H32 Z" fill="#fff"/>',
 noovertake:ring('#fff')+car(24,RED)+car(54,INK)
};
function signSVG(k){return '<svg class="sign" viewBox="0 0 100 100" role="img" aria-label="Дорожній знак">'+(SIGNS[k]||'')+'</svg>';}

/* ---------- icons ---------- */
var IC={
 x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 heart:function(on){return '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.8 0 5.9 3.9 4.5 7.2C19.5 16.4 12 21 12 21z" fill="'+(on?'var(--red)':'none')+'" stroke="var(--red)" stroke-width="1.8"/></svg>';},
 ticket:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 10h28v7a3 3 0 0 0 0 6v7H6v-7a3 3 0 0 0 0-6z"/><path d="M24 10v20" stroke-dasharray="3 3"/><path d="M11 16h8M11 21h6"/></svg>',
 clock:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="20" cy="22" r="13"/><path d="M20 22v-7M16 4h8M20 4v5"/></svg>',
 car:'<svg viewBox="0 0 44 24"><rect x="2" y="3" width="40" height="18" rx="7" fill="#F2C200"/><rect x="25" y="6" width="9" height="12" rx="2" fill="#1C2128"/><rect x="8" y="6" width="7" height="12" rx="2" fill="#1C2128"/><rect x="39" y="5" width="3" height="4" rx="1" fill="#fff"/><rect x="39" y="15" width="3" height="4" rx="1" fill="#fff"/></svg>'
};

/* ---------- navigation ---------- */
var current='home', RUN=null;
var SCREENS={home:home,ticket:ticket,game:game,topics:topics,profile:profile};
function go(name){
  if(RUN&&!RUN.ended){RUN.ended=true;stopRun();}
  current=name;document.body.classList.remove('focus');
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){if(b.dataset.go===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  view.innerHTML='';(SCREENS[name]||home)();window.scrollTo(0,0);
}
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-go]');if(b)go(b.dataset.go);});
view.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,arg=b.dataset.arg;
  if(ACTIONS[a])ACTIONS[a](arg,b);
});
var ACTIONS={
  go:function(n){go(n);},
  exam:function(){startExam();},
  marathon:function(){startMarathon('marathon');},
  signs:function(){startMarathon('signs');},
  blitz:function(){startBlitz();},
  topic:function(t){startTraining(t);},
  mistakes:function(){startTraining('__mistakes');},
  fresh:function(){startTraining('__new');},
  all:function(){startTraining('__all');}
};
function page(html){view.innerHTML='<div class="page">'+html+'</div>';return view.firstChild;}

/* ---------- screens ---------- */
function heroHTML(){
  var lv=level(S.xp),pct=Math.round(lv.rest/lv.need*100),sk=streak();
  return '<section class="hero" aria-label="Ваш прогрес">'+
    '<div class="hero-row" style="justify-content:space-between"><span class="eyebrow">Рівень '+lv.L+'</span><span class="lamp" aria-hidden="true"><i></i><i></i><i class="on"></i></span></div>'+
    '<h1>'+esc(rank(lv.L))+'</h1>'+
    '<div class="hero-row"><span class="chip">Серія <b>'+sk+'</b> '+plural(sk,'день','дні','днів')+'</span><span class="chip">Готовність до іспиту <b>'+readiness()+'%</b></span><span class="chip">Досвід <b>'+S.xp+'</b> XP</span></div>'+
    '<div class="road" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="До наступного рівня"><span class="done" style="width:'+pct+'%"></span><span class="car" style="left:calc(22px + '+pct+'% * 0.92)">'+IC.car+'</span></div>'+
    '<div class="road-labels"><span>Рівень '+lv.L+'</span><span class="mono">'+lv.rest+' / '+lv.need+' XP</span><span>Рівень '+(lv.L+1)+'</span></div>'+
  '</section>';
}
function home(){
  var mc=S.mistakes.filter(function(id){return QById[id];}).length;
  var weak=activeTopics().map(function(t){var ids=topicIds(t);var m=ids.filter(mastered).length;return {t:t,p:m/ids.length,m:m,n:ids.length};}).sort(function(a,b){return a.p-b.p;}).slice(0,3);
  page(heroHTML()+
   '<section class="grid">'+
     '<button class="action primary" data-act="exam"><span class="ic">'+IC.ticket+'</span><div><b>Пройти білет</b><span>20 питань · 20 хвилин · до 2 помилок, як у сервісному центрі</span></div></button>'+
     '<button class="action" data-act="marathon"><span class="ic">'+IC.heart(true).replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="36" height="36"')+'</span><div><b>Марафон</b><span>Безкінечна гра: 3 життя, комбо, рекорди. Рекорд: '+S.best.marathon+'</span></div></button>'+
     '<button class="action" data-act="signs"><span class="ic">'+signSVG('giveway')+'</span><div><b>Знаки</b><span>Вгадай дорожній знак. Рекорд: '+S.best.signs+'</span></div></button>'+
     '<button class="action" data-act="mistakes"'+(mc?'':' disabled style="opacity:.55;cursor:default"')+'><span class="ic">'+signSVG('danger')+'</span><div><b>Мої помилки</b><span>'+(mc?mc+' '+plural(mc,'питання','питання','питань')+' на повторення':'Поки що помилок немає')+'</span></div></button>'+
   '</section>'+
   '<section class="section"><div class="section-head"><h2>Найслабші теми</h2><button class="link" data-act="go" data-arg="topics">Усі теми</button></div>'+
     '<div class="grid">'+weak.map(topicBtn).join('')+'</div></section>'+
   (S.exams.length?'<section class="section"><div class="section-head"><h2>Останні білети</h2><button class="link" data-act="go" data-arg="ticket">Історія</button></div>'+examHistory(3)+'</section>':'')
  );
}
function topicBtn(x){
  return '<button class="topic" data-act="topic" data-arg="'+x.t+'"><b>'+esc(TOPICS[x.t])+'</b><span class="mono muted">'+x.m+'/'+x.n+'</span><span class="bar"><i style="width:'+Math.round(x.p*100)+'%"></i></span></button>';
}
function examHistory(n){
  var list=S.exams.slice(-n).reverse();

/* ---------- quiz engine ---------- */
function makeItem(q){return {q:q,order:shuffle(q.a.map(function(_,k){return k;})),pick:null};}
function weightedPick(pool,recent){
  var cand=pool.filter(function(q){return recent.indexOf(q.id)<0;});if(!cand.length)cand=pool;
  var w=cand.map(function(q){var s=S.stats[q.id];if(!s)return 3;if(s.s===0&&s.w>0)return 5;if(s.s<2)return 2.5;return 1;});
  var tot=w.reduce(function(a,b){return a+b;},0),r=Math.random()*tot;
  for(var i=0;i<cand.length;i++){r-=w[i];if(r<=0)return cand[i];}return cand[cand.length-1];
}
function stopRun(){if(RUN&&RUN.timer){clearInterval(RUN.timer);RUN.timer=null;}}

function startExam(){
  var list=shuffle(Q).slice(0,20).map(makeItem);
  begin({mode:'exam',title:'Білет · 20 питань',items:list,time:1200});
}
function startTraining(t){
  var pool,title;
  if(t==='__mistakes'){pool=S.mistakes.map(function(id){return QById[id];}).filter(Boolean);title='Мої помилки';}
  else if(t==='__new'){pool=Q.filter(function(q){return !S.stats[q.id];});if(!pool.length)pool=Q.filter(function(q){return !mastered(q.id);});title='Нові питання';pool=shuffle(pool).slice(0,20);}
  else if(t==='__all'){pool=Q;title='Усі питання';}
  else{pool=Q.filter(function(q){return q.t===t;});title=TOPICS[t]||'Тема';}
  if(!pool.length){toast('✓','Тут усе вивчено','Оберіть іншу тему або гру');return;}
  begin({mode:'train',title:title,items:shuffle(pool).map(makeItem)});
}
function startMarathon(kind){
  var pool=kind==='signs'?Q.filter(function(q){return q.t==='signs';}):Q;
  begin({mode:kind,title:kind==='signs'?'Знаки':'Марафон',items:[],pool:pool,lives:3,endless:true});
}
function startBlitz(){begin({mode:'blitz',title:'Бліц 60 секунд',items:[],pool:Q,time:60,endless:true});}

function begin(cfg){
  stopRun();
  RUN={cfg:cfg,mode:cfg.mode,items:cfg.items,i:0,lives:cfg.lives||0,combo:0,maxCombo:0,correct:0,wrong:0,xp:0,timeLeft:cfg.time||0,started:Date.now(),ended:false,recent:[],confirmExit:false};
  if(cfg.endless)pushNext();
  document.body.classList.add('focus');
  if(cfg.time){RUN.timer=setInterval(tick,1000);}
  renderQ();
}
function pushNext(){var q=weightedPick(RUN.cfg.pool,RUN.recent);RUN.recent.push(q.id);if(RUN.recent.length>Math.min(25,Math.floor(RUN.cfg.pool.length*0.6)))RUN.recent.shift();RUN.items.push(makeItem(q));}
function tick(){
  if(!RUN||RUN.ended)return;RUN.timeLeft--;
  var t=document.getElementById('tmr');if(t){t.textContent=fmtTime(RUN.timeLeft);t.classList.toggle('low',RUN.timeLeft<=(RUN.mode==='blitz'?10:120));}
  if(RUN.timeLeft<=0)finish();
}
function headerHTML(){
  var R=RUN,m=R.mode,meta='';
  if(m==='exam'||m==='blitz')meta+='<span class="timer'+(R.timeLeft<=(m==='blitz'?10:120)?' low':'')+'" id="tmr">'+fmtTime(R.timeLeft)+'</span>';
  if(m==='marathon'||m==='signs'){meta+='<span class="hearts" aria-label="Життя: '+R.lives+'">'+[0,1,2].map(function(k){return IC.heart(k<R.lives);}).join('')+'</span>';}
  if(m!=='exam'&&m!=='train')meta+='<span class="mono" aria-label="Рахунок">'+R.correct+'</span>';
  if(m!=='exam'&&R.combo>=3)meta+='<span class="combo" id="cmb">×'+R.combo+'</span>';
  var h='<div class="qtop"><div class="qbar"><button class="x" data-q="exit" aria-label="Вийти">'+IC.x+'</button><span class="ttl">'+esc(R.cfg.title)+'</span><span class="meta">'+meta+'</span></div>';
  if(m==='exam'){h+='<div class="cells">'+R.items.map(function(it,k){var c='';if(it.pick!=null)c=it.order[it.pick]===0?'ok':'bad';return '<button data-q="jump" data-k="'+k+'" class="'+c+(k===R.i?' cur':'')+'" aria-label="Питання '+(k+1)+'">'+(k+1)+'</button>';}).join('')+'</div>';}
  else if(m==='train'){h+='<div class="track"><i style="width:'+Math.round(R.i/R.items.length*100)+'%"></i></div>';}
  if(R.confirmExit){h+='<div class="confirm"><p><b>Вийти?</b> '+(m==='exam'?'Білет не буде зараховано.':'Результат цієї гри збережеться.')+'</p><div class="btn-row"><button class="btn danger" data-q="exitYes">Вийти</button><button class="btn ghost" data-q="exitNo">Продовжити</button></div></div>';}
  return h+'</div>';
}
function renderQ(){
  var R=RUN,it=R.items[R.i],q=it.q,answered=it.pick!=null,m=R.mode;
  var letters=['А','Б','В','Г','Ґ','Д','Е'];
  var showResult=answered&&m!=='exam';
  var opts=it.order.map(function(orig,k){
    var cls='opt';
    if(answered){
      if(m==='exam'){if(k===it.pick)cls+=orig===0?' right':' wrong';}
      else{if(orig===0)cls+=' right';else if(k===it.pick)cls+=' wrong';}
    }
    return '<button class="'+cls+'" data-q="ans" data-k="'+k+'"'+(answered?' disabled':'')+'><span class="k">'+letters[k]+'</span><span>'+esc(q.a[orig])+'</span></button>';
  }).join('');
  var num=m==='exam'?('Питання '+(R.i+1)+' з 20'):m==='train'?('Питання '+(R.i+1)+' з '+R.items.length):('Питання '+(R.i+1));
  var media=q.s?'<div class="qmedia">'+signSVG(q.s)+'</div>':(q.img?'<div class="qmedia"><img src="'+esc(q.img)+'" alt="Ілюстрація до питання"></div>':'');
  var fb='';
  if(showResult){var ok=it.order[it.pick]===0;fb='<div class="fb'+(ok?'':' bad')+'"><b>'+(ok?pickPraise():'Неправильно')+'</b><p>'+esc(q.e||'')+'</p>'+(q.r?'<span class="ref">'+refText(q.r)+'</span>':'')+'</div>';}
  var foot='';
  if(m==='exam'){
    var left=R.items.filter(function(x){return x.pick==null;}).length;
    foot='<div class="qfoot"><span class="kbd">Без відповіді: '+left+'</span><div class="btn-row">'+(answered?'<button class="btn" data-q="next">'+(left?'Наступне':'Завершити')+'</button>':'<button class="btn ghost" data-q="skip">Пропустити</button>')+(left&&answered?'<button class="btn ghost" data-q="finish">Завершити</button>':'')+'</div></div>';
  }else if(showResult&&m!=='blitz'){
    var last=m==='train'&&R.i>=R.items.length-1;var dead=(m==='marathon'||m==='signs')&&R.lives<=0;
    foot='<div class="qfoot"><span class="kbd">Enter — далі</span><button class="btn" data-q="next" id="nextBtn">'+(last||dead?'Результат':'Далі')+'</button></div>';
  }else if(!answered){foot='<div class="qfoot"><span class="kbd">Клавіші 1–'+q.a.length+' для відповіді</span></div>';}
  view.innerHTML='<div class="page">'+headerHTML()+
    '<article class="qcard" id="qcard"><div class="qhead"><span class="eyebrow">'+num+'</span><span class="eyebrow">'+esc(TOPICS[q.t]||'')+'</span></div>'+media+
    '<p class="qtext">'+esc(q.q)+'</p><div class="opts">'+opts+'</div>'+fb+foot+'</article></div>';
  var nb=document.getElementById('nextBtn');if(nb)nb.focus({preventScroll:true});
}
var PRAISE=['Правильно','Точно','Так і є','Чудово','Бездоганно'];
function pickPraise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)];}
function refText(r){if(r==='Безпека')return 'Безпека руху';if(r==='33')return 'ПДР, розділ 33 «Дорожні знаки»';return r.indexOf('.')>0?'ПДР, пункт '+r:'ПДР, розділ '+r;}

view.addEventListener('click',function(e){
  if(!RUN||RUN.ended)return;var b=e.target.closest('[data-q]');if(!b)return;
  var a=b.dataset.q;
  if(a==='ans')answer(+b.dataset.k);
  else if(a==='next')next();
  else if(a==='skip')nextUnanswered(true);
  else if(a==='jump'){RUN.i=+b.dataset.k;renderQ();}
  else if(a==='finish')finish();
  else if(a==='exit'){RUN.confirmExit=true;renderQ();}
  else if(a==='exitNo'){RUN.confirmExit=false;renderQ();}
  else if(a==='exitYes'){if(RUN.mode==='exam'){RUN.ended=true;stopRun();go('ticket');}else finish();}
});
document.addEventListener('keydown',function(e){
  if(!RUN||RUN.ended||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA)$/.test((e.target.tagName||'')))return;
  var it=RUN.items[RUN.i];var n=parseInt(e.key,10);
  if(n>=1&&n<=it.q.a.length&&it.pick==null){e.preventDefault();answer(n-1);}
  else if((e.key==='Enter'||e.key===' ')&&it.pick!=null&&document.querySelector('[data-q="next"]')){e.preventDefault();next();}
});

function answer(k){
  var R=RUN,it=R.items[R.i];if(it.pick!=null)return;
  it.pick=k;var ok=it.order[k]===0;record(it.q,ok);
  if(ok){R.correct++;R.combo++;if(R.combo>R.maxCombo)R.maxCombo=R.combo;}else{R.wrong++;R.combo=0;vibrate(80);}
  var m=R.mode,gain=0;
  if(ok){gain=m==='exam'?10:m==='train'?8:10+Math.min(R.combo,10);R.xp+=gain;addXP(gain);}
  if(!ok&&(m==='marathon'||m==='signs'))R.lives--;
  if(m!=='exam'&&m!=='train'&&R.maxCombo>S.best.combo){S.best.combo=R.maxCombo;save();}
  checkAch();
  if(m==='blitz'){
    if(!ok)R.timeLeft=Math.max(0,R.timeLeft-5);
    renderQ();var card=document.getElementById('qcard');if(card&&!ok)card.classList.add('shake');
    setTimeout(function(){if(R.ended||RUN!==R)return;if(R.timeLeft<=0){finish();return;}pushNext();R.i++;renderQ();},ok?450:1100);
    return;
  }
  renderQ();
  var card=document.getElementById('qcard');if(card&&!ok)card.classList.add('shake');
  var c=document.getElementById('cmb');if(c&&ok)c.classList.add('pop');
}
function next(){
  var R=RUN,m=R.mode;
  if(m==='exam'){nextUnanswered(false);return;}
  if(m==='train'){if(R.i>=R.items.length-1){finish();return;}R.i++;renderQ();window.scrollTo(0,0);return;}
  if(R.lives<=0){finish();return;}
  pushNext();R.i++;renderQ();window.scrollTo(0,0);
}
function nextUnanswered(skipping){
  var R=RUN,n=R.items.length;
  for(var s=1;s<=n;s++){var k=(R.i+s)%n;if(R.items[k].pick==null&&(k!==R.i||!skipping)){R.i=k;renderQ();window.scrollTo(0,0);return;}}
  if(R.items.every(function(x){return x.pick!=null;}))finish();else{renderQ();}
}
function finish(){
  var R=RUN;if(R.ended)return;R.ended=true;stopRun();
  var m=R.mode,html='',used=Math.round((Date.now()-R.started)/1000);
  document.body.classList.remove('focus');
  if(m==='exam'){
    var score=R.items.filter(function(x){return x.pick!=null&&x.order[x.pick]===0;}).length;var errs=20-score;var pass=errs<=2;
    if(pass){addXP(100);R.xp+=100;}
    S.exams.push({d:Date.now(),score:score,pass:pass,time:Math.min(used,1200)});if(S.exams.length>200)S.exams=S.exams.slice(-200);save();checkAch();
    html='<section class="result"><span class="eyebrow" style="color:var(--asphalt-muted)">Результат білета</span><span class="big mono">'+score+'/20</span><span class="verdict '+(pass?'ok':'bad')+'">'+(pass?'Іспит складено':'Не складено')+'</span><p class="muted">'+(pass?'Помилок: '+errs+'. Так тримати.':'Помилок: '+errs+'. Для складання дозволено не більше двох.')+' Час: '+fmtTime(Math.min(used,1200))+' · +'+R.xp+' XP</p></section>'+
      '<div class="btn-row"><button class="btn go" data-act="exam">Новий білет</button><button class="btn ghost" data-act="go" data-arg="home">На головну</button></div>'+
      '<section class="section"><h2>Розбір питань</h2><div class="review">'+R.items.map(reviewRow).join('')+'</div></section>';
  }else{
    var total=R.correct+R.wrong,acc=total?Math.round(R.correct/total*100):0,best='',isRec=false;
    if(m==='marathon'||m==='signs'||m==='blitz'){if(R.correct>S.best[m]){S.best[m]=R.correct;isRec=R.correct>0;}best=S.best[m];save();checkAch();}
    var label=m==='train'?'Правильних відповідей':m==='blitz'?'Відповідей за 60 секунд':'Рахунок';
    var again=m==='train'?'':'<button class="btn go" data-act="'+(m==='marathon'?'marathon':m==='signs'?'signs':'blitz')+'">Грати ще</button>';
    var wrongs=R.items.filter(function(x){return x.pick!=null&&x.order[x.pick]!==0;});
    html='<section class="result"><span class="eyebrow" style="color:var(--asphalt-muted)">'+esc(R.cfg.title)+'</span><span class="big mono">'+R.correct+(m==='train'?'/'+R.items.length:'')+'</span><p class="muted">'+label+' · точність '+acc+'% · найдовше комбо ×'+R.maxCombo+' · +'+R.xp+' XP</p>'+
      (isRec?'<span class="verdict ok">Новий рекорд!</span>':(best!==''?'<p class="muted">Рекорд: '+best+'</p>':''))+'</section>'+
      '<div class="btn-row">'+again+(m==='train'?'<button class="btn" data-act="go" data-arg="topics">До тем</button>':'')+(S.mistakes.length?'<button class="btn ghost" data-act="mistakes">Повторити помилки</button>':'')+'<button class="btn ghost" data-act="go" data-arg="home">На головну</button></div>'+
      (wrongs.length?'<section class="section"><h2>Помилки цієї спроби</h2><div class="review">'+wrongs.map(reviewRow).join('')+'</div></section>':'');
  }
  view.innerHTML='<div class="page">'+html+'</div>';window.scrollTo(0,0);
}
function reviewRow(it,k){
  var q=it.q,ok=it.pick!=null&&it.order[it.pick]===0;
  var yours=it.pick==null?'<i>без відповіді</i>':esc(q.a[it.order[it.pick]]);
  return '<details><summary><span class="n'+(ok?'':' bad')+'">'+(k+1)+'</span><span>'+esc(q.q)+(q.s?' <span class="muted">(знак)</span>':'')+'</span></summary><div class="body">'+(q.s?'<div style="width:90px">'+signSVG(q.s)+'</div>':'')+
    (ok?'':'<p><span class="pill bad">Ваша відповідь</span> '+yours+'</p>')+'<p><span class="pill ok">Правильно</span> '+esc(q.a[0])+'</p><p class="muted">'+esc(q.e)+'</p>'+(q.r?'<p class="muted" style="font-size:.82rem;font-weight:600">'+refText(q.r)+'</p>':'')+'</div></details>';
}

go('home');
})();
</script>
